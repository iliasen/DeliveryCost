spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: delivery-cost
          uri: http://localhost:5000
          predicates:
            - Path=/delivery-cost/**
          filters:
            - AddRequestHeader=Authorization, ${auth-header}
            - RewritePath=/delivery-cost/(?<segment>.*), /${segment}
  security:
    user:
      name: admin
      password: 7756

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8081