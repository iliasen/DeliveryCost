version: '3'
services:
  postgres:
    image: postgres
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 7756
      POSTGRES_DB: deliv_cost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./server/
      dockerfile: ./docker/Dockerfile
    container_name: WorkHub
    ports:
      - 5000:5000
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliv_cost

volumes:
  postgres_data: